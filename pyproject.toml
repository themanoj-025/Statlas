# Statlas — Python tooling configuration.
#
# The project has no packaging metadata (dependencies are declared in
# requirements.txt); this file exists so `ruff check` behaves identically in CI
# and locally. The enforced set is deliberately smaller than ruff's defaults:
# the deferred rules are documented in docs/engineering/migration_summary.md §7.
[tool.ruff]
target-version = "py310" # code floor; local dev and CI run Python 3.14

[tool.ruff.lint]
# Enforced: pyflakes (F), pycodestyle errors (E4/E7/E9), import sorting (I),
# and DTZ* (timezone policy — closeout C2, see docs/engineering/timezone-policy.md).
# Deferred pending human review (not in the CI gate): UP037 quoted SQLAlchemy
# annotations, BLE001 blind excepts (intentional in weekly_refresh enrichment),
# SIM* style simplifications, B017 test assertion.
select = ["E4", "E7", "E9", "F", "I", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# seed_dev_db.py sets DATABASE_URL via os.environ.setdefault BEFORE importing
# db (db reads the URL at import time) — the E402 is the script's point.
"scripts/seed_dev_db.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
