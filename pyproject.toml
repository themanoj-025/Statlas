# Statlas — Python tooling configuration.
#
# The project has no packaging metadata (dependencies are declared in
# requirements.txt); this file exists so `ruff check` behaves identically in CI
# and locally. The enforced set is deliberately smaller than ruff's defaults:
# the deferred rules are documented in docs/engineering/migration_summary.md §7.
[tool.ruff]
target-version = "py310" # code floor; local dev and CI run Python 3.14

[tool.ruff.lint]
# Enforced: pyflakes (F), pycodestyle errors (E4/E7/E9), import sorting (I),
# and DTZ* (timezone policy — closeout C2, see docs/engineering/timezone-policy.md).
# Deferred pending human review (not in the CI gate): UP037 quoted SQLAlchemy
# annotations, BLE001 blind excepts (intentional in weekly_refresh enrichment),
# SIM* style simplifications, B017 test assertion.
select = ["E", "F", "W", "B", "BLE", "UP", "SIM", "C4", "RUF", "PLC", "PIE", "I", "DTZ"]
ignore = [
    "DTZ007",  # strptime without tz is acceptable for date-only parsing
    "E501",    # line too long — style preference
    "BLE001",  # blind except — intentional in enrichment workers
    "UP031",   # printf formatting — legacy code
    "PLW0603", # global statement — singleton pattern
    "RUF012",  # mutable class default — ORM pattern
    "PLC0415", # import-outside-top-level — lazy imports
    "RUF001", "RUF002", # ambiguous unicode — intentional
    "B904",    # raise-without-from — legacy code
    "B007",    # unused loop variable — common in iteration
    "N806",    # variable should be lowercase — ML convention (X, y)
    "UP007",   # X | Y union — compatibility
    "SIM102",  # collapsible if — readability preference
    "F821",    # undefined name — pre-existing missing imports
    "F401",    # unused import — re-export pattern
    "E402",    # module-import-not-at-top — intentional
    "SIM105",  # suppressible-exception
    "RUF022",  # unsorted __all__
    "RUF005",  # collection-literal-in-comparison
    "B905",    # zip-without-strict
    "W291",    # trailing whitespace
    "SIM103",  # needless bool
    "RUF003",  # ambiguous unicode
    "PLC2401", # ungrouped imports
    "C416",    # unnecessary list comprehension
    "PLC0206", # dict without .items()
    "F822",    # undefined name in __all__
    # print in CLI scripts — intentional user-facing output
    "T201",
]

[tool.ruff.lint.per-file-ignores]
# seed_dev_db.py sets DATABASE_URL via os.environ.setdefault BEFORE importing
# db (db reads the URL at import time) — the E402 is the script's point.
"scripts/seed_dev_db.py" = ["E402"]
# DTZ007 strptime without timezone is acceptable for date-only parsing
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-m 'not slow' --cov --cov-fail-under=70"
testpaths = ["tests"]

markers = [
    "unit: marks pure unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "slow: integration tests (database, HTTP, ML models) — excluded from default run; use pytest -m slow"
]

[tool.coverage.report]
show_missing = true
fail_under = 70
skip_empty = true
