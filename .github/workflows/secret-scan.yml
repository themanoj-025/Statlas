# ════════════════════════════════════════════════════════════════
# secret-scan.yml — gitleaks on push and PR
# Detects secrets committed to the working tree or history.
# ════════════════════════════════════════════════════════════════
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily scan of full history
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history required for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@master
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          path: ./
          args: --verbose --redact
