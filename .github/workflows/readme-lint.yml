# Cancel superseded runs of this workflow on the same ref (PR pushes).
# Never cancels on main pushes or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: README Lint

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  lint-readme:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint README links, anchors, heading levels, and code fences
        run: python3 .github/scripts/lint_readme.py
