# Cancel superseded runs of this workflow on the same ref (PR pushes).
# Never cancels on main pushes or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token scope; jobs declaring their own permissions override this.
permissions:
  contents: read

name: PR Size Check
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  check-size:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          ADDITIONS=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $4}')
          if [ "$ADDITIONS" -gt 500 ]; then
            echo "⚠️ PR has $ADDITIONS additions (limit: 500). Consider splitting."
          fi
